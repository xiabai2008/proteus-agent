# modes/ctf-web.yaml
id: ctf-web
label: CTF Web 模式
inherits: base
persona: {system_prompt: prompts/ctf.md, output_format: raw_flag}
capability:
  # 只写真名或前缀通配（2026-09-24 P0-2 修正）。
  # 历史 bug：这里曾写抽象契约名（http_test / browser_auto / script_run /
  # file_read / crypto_tools），与真实注册名对不上——allow 是精确匹配，
  # 于是 **CTF 模式连 http_raw 都被拒绝**，且 --authorize 也抬不动
  # （allow 未命中与 hard_deny 同类）。实测与修法见
  # docs/修复待办清单.md R-26。
  allow: [http_raw, http_probe, dns_lookup, robots_fetch, port_scan,
          codec_decode, codec_chain, file_type, python_solve, rsactf_attack,
          chameleon_*, seckb_*, binwalk_*, capa_*, yara_*, searchsploit_*,
          cyberchef_*]
  deny: [nuclei, fscan, sqlmap]
permission:
  default: ask
  auto_approve: [codec_decode, codec_chain, file_type, http_probe, http_raw,
                 dns_lookup, robots_fetch, seckb_*]
  require_confirm: [python_solve, rsactf_attack, port_scan]
  hard_deny: []
# max_cost_usd 为预留字段（当前不生效），详见 modes/base.yaml 的注释
budget: {max_steps: 60, max_minutes: 20, max_cost_usd: 1.0}
scope: {network_egress: true}
verifier: {type: flag_regex, pattern: '(?i)(flag|ctf)\{[^}]+\}', auto_retry: 3}
triggers: [ctf, flag, 解题, 比赛, web]
skills: [ctf-web]
memory_namespace: ctf-web
# 同 ctf-crypto：解题脚本等价宿主任意代码执行（python_solve 声明 sandbox: docker），
# 因此本档为 docker——容器不可用时该工具被拒绝，不会回落宿主直跑。
sandbox: docker
