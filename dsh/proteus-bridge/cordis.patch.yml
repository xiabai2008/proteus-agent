# dsh-proteus-bridge —— 宿主事件桥（host 平面 bundle 层）
#
# 做什么：订阅 `session/event` 里的 `tool/call` 与 `tool/result`，把**会话里
# 发生的每一次工具调用**（不管是内核工具还是宿主自带工具）追加写进 spool
# 文件；内核侧的导入器（`python -m penagent dsh-sync`）再把 spool 并入
# penagent 的链式哈希证据链。
#
# 为什么需要它：2026-09-21 的真机实测发现模型会绕开内核工具、直接用宿主
# shell 干活——那种情况下内核的证据链/记忆/技能全部空转，结论不可机验。
# 本插件不阻止旁路（那是 pre-execute 裁决的事，且要先保证内核工具够用），
# 只保证**旁路也留痕**、且痕迹可机验。
#
# 只读观测：不 allow/deny、不改结果、不阻断任何调用；写 spool 失败也不抛
# ——审计通道断掉不该让会话失败（fail-open），失败只在控制台留痕。
#
# 安装（profile 侧）：
#   dsh plugin --profile web add <REPO>/dsh/proteus-bridge
# 注意：装完要重启 DSH 进程（bundle 层在启动时合成）。
#
# 三步走里的第三步：`tools/pre-execute` 目标动作裁决。
#
# 规则（只针对"对目标发请求"的宿主 shell 命令，其它一概不管）：
#   - 命令里出现网络动词（curl / Invoke-WebRequest / sqlmap / nmap …）时：
#     目标在授权集内 → 按 `mode`（默认 ask）裁决，理由里给出内核替代工具；
#     目标在授权集外 → 同样 ask，理由说明"内核白名单不会放行该目标"。
#   - 非网络命令（本地文件、echo、脚本）→ 放行，不打扰。
#   - `mcp__proteus__*` 一律放行（它本身已经过内核闸门）。
# 裁决结果同时写进 spool（kind: policy），审计链里能看到"为什么被问/被拒"。
#
# mode: ask（默认，用户已拍板先跑一段时间）/ deny（收紧）/ off（只观测不裁决）

- insert:
    - id: proteus-bridge
      name: dsh-proteus-bridge
      config:
        # spool 落盘位置：跟随 PENTEST_WS（本机路径不入库，与 preset 同约定）。
        # 注意 !!js 整行禁止出现 ": "（冒号+空格会被 YAML 拆成映射键）
        spoolPath: !!js (process.env.PENTEST_WS || '.') + '/proteus-agent/data/dsh-events.jsonl'
        mode: ask
        targets: ['127.0.0.1', 'localhost']
        shellTools: ['pwsh', 'bash']
