# modes/ctf-web.yaml
id: ctf-web
label: CTF Web 模式
inherits: base
persona: {system_prompt: prompts/ctf.md, output_format: raw_flag}
capability:
  # 只写真名或前缀通配（2026-09-24 P0-2 修正）。
  # 历史 bug：这里曾写抽象契约名（http_test / browser_auto / script_run /
  # file_read / crypto_tools），与真实注册名对不上——allow 是精确匹配，
  # 于是 **CTF 模式连 http_raw 都被拒绝**，且 --authorize 也抬不动
  # （allow 未命中与 hard_deny 同类）。实测与修法见
  # docs/修复待办清单.md R-26。
  allow: [http_raw, http_probe, dns_lookup, robots_fetch, port_scan,
          session_http, replay_request, report_gen, oob_read,
          codec_decode, codec_chain, file_type, python_solve, rsactf_attack,
          checksec_bin, native_emu, file_read, file_write, file_edit,
          flag_claim,
          pentest_set_mode, pentest_evidence, pentest_missions, pentest_skills,
          chameleon_*, seckb_*, binwalk_*, capa_*, yara_*, searchsploit_*,
          cyberchef_*]
  deny: [nuclei_scan, fscan_scan, sqlmap_auto, ffuf_fuzz, gobuster_dir,
         dalfox_xss, naabu_scan, pocsuite_poc]
permission:
  default: ask
  auto_approve: [codec_decode, codec_chain, file_type, file_read, http_probe,
                 http_raw, dns_lookup, robots_fetch, seckb_*, report_gen,
                 oob_read, native_emu, flag_claim]
  require_confirm: [python_solve, rsactf_attack, port_scan, file_write,
                    file_edit]
  hard_deny: []
# max_cost_usd 为预留字段（当前不生效），详见 modes/base.yaml 的注释
# 60/20 → 120/60：与 ctf-crypto 同口径（2026-09-27 实测，见 R-45）。
budget: {max_steps: 120, max_minutes: 60, max_cost_usd: 1.0}
scope:
  network_egress: true
  # 目标闸门开关（2026-09-27 用户拍板）：CTF 比赛的靶由平台给定，逐题
  # `/proteus-scope add` 是纯摩擦——本模式声明"不做目标授权校验"。
  # 它只关**目标白名单**这一道；能力名单、permission 档位、沙箱档位、证据链、
  # 注入护栏、宿主侧目标动作裁决全都照旧。代价如实记在这里：目标闸门也是
  # 注入护栏的最后一道，题目内容若诱导把工具引向别的 host，这条不再拦。
  # 要收回：把 unrestricted 改回 false（或删掉这一行）。
  unrestricted: true
# 关于"公开参考资料站"（2026-09-27 订正）：此前这里写过
# target_allowlist: [xz.aliyun.com, ...]，**已撤销**——该字段语义是
# "只可收紧"（与运行期显式授权取交集），写进模式会把 127.0.0.1 / localhost
# 一并交掉：交集为空 = 全拒（实测
# tests/test_modes.py::test_ctf_web_allows_http_and_denies_heavy_scanners
# 转红，本地 CTF 靶也够不着）。要放公开站走运行期显式授权：
# 会话内 /proteus-scope add <host>，或 preset 的 --targets（人工编辑）。
verifier: {type: flag_regex, pattern: '(?i)(flag|ctf)\{[^}]+\}', auto_retry: 3}
triggers: [ctf, flag, 解题, 比赛, web]
skills: [ctf-web]
memory_namespace: ctf-web
# 同 ctf-crypto：解题脚本等价宿主任意代码执行（python_solve 声明 sandbox: docker），
# 因此本档为 docker——容器不可用时该工具被拒绝，不会回落宿主直跑。
sandbox: docker
