# The `proteus` agent preset — Proteus · 千面（多模式渗透测试 Agent）的 DSH 宿主接入。
# 方案 D：只配置，不改 DSH 核心代码。
#
# 本文件是 AGENT 平面 composition：preset 只贡献"一个会话往注册表里放什么"
# ——人格与工具。注册表本身、沙箱与审批栈、模型路由留在 host 平面
# （见 packages/bundle/base/cordis.patch.yml）。preset 里若要发布服务，
# 必须放进带 `isolate` realm 的 group，否则会与别的 preset 抢根 realm。
#
# 发现机制（packages/preset/agent-presets/src/discovery.ts）：
#   根目录 = $DSH_HOME/.agent-presets（用户可写） + 随包发布的只读 system 根；
#   目录名即 preset id（须匹配 /^[a-z0-9][a-z0-9-]*$/）；
#   `agent.cordis.yml` 顶层是插件行列表；行内 name 可写包名，也可写相对本
#   目录的文件路径（discovery 按 preset 目录解析 file 行）。

# ── identity ────────────────────────────────────────────────────────────────
# 人格由随 preset 的本地插件注册：挂载时读取 Proteus 仓库的 prompts/ 下人格
# 文件，注册成 deployment:persona-prefix 分区，遮蔽部署默认人格。
# 提示词以仓库文件为唯一来源，不在此复制。
- id: persona
  name: './proteus-persona.mjs'
  config:
    # 仓库根来自操作员环境变量 PENTEST_WS（公开仓库零本机路径约定，
    # 见 README「环境变量」一节；!!js 在加载器作用域求值）。
    promptPath: !!js (process.env.PENTEST_WS || '') + '/proteus-agent/prompts/dsh-persona.md'
    suffix: >-
      本会话通过 mcp__proteus__* 工具驱动 Proteus 内核；模式（pentest-standard /
      ctf-web / ctf-crypto）由内核侧 ModeProfile 决定，工具白名单与权限档位随之生效。

# ── tools：Proteus 内核（MCP over stdio）─────────────────────────────────────
# 一个 mcp-client 实例 = 一个外部 MCP server。工具在会话里以
# `mcp__<serverName>__<rawName>` 出现，因此 serverName 取 `proteus`，
# 模型侧看到的就是 mcp__proteus__pentest_run 这类名字。
#
# command 用绝对路径：DSH 会把子进程环境"洗"一遍，PATH 上不一定有 python。
# cwd 指向内核仓库根，`-m penagent` 才能解析到包。
# env 里的三个键是给内核侧 LLM 决策循环（pentest_run）用的；DSH 的
# !!js 表达式在加载器作用域求值，这里直接透传宿主环境变量，缺省为空串
# （内核按"未配置"处理，走默认端点）。
- id: mcp-proteus
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: proteus
    # Python 解释器：PENTEST_PY312 指向解释器**目录**（setx 持久化），此处拼 python.exe；
    # 未设置时回退 PATH 上的 python。
    # 注意：!!js 裸写三元表达式里的 ": " 会被 YAML 解析成映射键（实测
    # "command: [object Object]"），故用 || 短路形式，整行不得出现 ": "。
    command: !!js (process.env.PENTEST_PY312 || 'python') + '/python.exe'
    args: ['-m', 'penagent', 'mcp', '--data', 'data', '--targets',
           '127.0.0.1,localhost', '--authorize']
    cwd: !!js (process.env.PENTEST_WS || '') + '/proteus-agent'
    env:
      PENTEST_LLM_BASE_URL: !!js process.env.PENTEST_LLM_BASE_URL ?? ''
      PENTEST_LLM_API_KEY: !!js process.env.PENTEST_LLM_API_KEY ?? ''
      PENTEST_LLM_MODEL: !!js process.env.PENTEST_LLM_MODEL ?? ''
    toolCallTimeoutMs: 600000
    # 内核没起来时不让整个 preset 挂载失败：工具目录里少一组 proteus 工具，
    # 但会话仍可用（配合 docs/DSH宿主接入指南.md 的排查步骤）。
    failOnStartupError: false