<svg viewBox="0 0 920 648" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Proteus · 千面 — 架构总览</title>
  <desc>五层结构：宿主层（双入口）、模式层 ModeProfile、内核层 XPentest、工具层 MCP 统一注册、环境层隔离与边界。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="648" rx="14" fill="#ffffff"/>
  <text x="460" y="38" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="600" fill="#1c2024">Proteus · 千面 — 架构总览</text>

  <!-- 宿主层 -->
  <rect x="30" y="58" width="860" height="96" rx="14" fill="#F5F9FD" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="48" y="80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#185FA5">宿主层 Host（双入口，能力同一套）</text>
  <rect x="48" y="92" width="410" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="253" y="109" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">入口一 · 自有 CLI / SDK / Web 控制台（独立运行，可进 CI）</text>
  <rect x="482" y="92" width="392" height="26" rx="7" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="678" y="109" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">入口二 · deepseek-harness agent-preset（沙箱 / 审批 / Web UI）</text>

  <line x1="460" y1="128" x2="460" y2="152" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 模式层 -->
  <rect x="30" y="156" width="860" height="102" rx="14" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="48" y="178" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C447C">模式层 · ModeProfile（一等公民）— persona / capability / permission / budget / scope / verifier / skills / sandbox</text>
  <rect x="48" y="190" width="410" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="253" y="209" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0C447C">常规渗透模式</text>
  <text x="253" y="229" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">证据链判定 · 小时级预算 · 工具参数冻结</text>
  <rect x="482" y="190" width="392" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="678" y="209" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0C447C">CTF 比赛模式</text>
  <text x="678" y="229" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">flag 正则判定 · 分钟级预算 · 代码执行沙箱</text>

  <line x1="460" y1="260" x2="460" y2="284" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 内核层 -->
  <rect x="30" y="288" width="860" height="96" rx="14" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="48" y="310" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#0C447C">内核层 · XPentest（Python，可独立运行）</text>
  <rect x="48" y="322" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="183" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0C447C">ReAct 决策循环</text>
  <text x="183" y="358" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">规划 → 护栏 → 执行 → 观察</text>
  <rect x="330" y="322" width="270" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="465" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0C447C">证据链反幻觉</text>
  <text x="465" y="358" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">链式哈希 · 引用校验硬拦截</text>
  <rect x="612" y="322" width="262" height="48" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
  <text x="743" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13.5" font-weight="600" fill="#0C447C">记忆 · 技能进化</text>
  <text x="743" y="358" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">成功率回写 · RL 策略选择</text>

  <line x1="460" y1="386" x2="460" y2="410" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 工具层 -->
  <rect x="30" y="414" width="860" height="96" rx="14" fill="#F5F9FD" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="48" y="436" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#185FA5">工具层 · MCP 统一注册（新增能力不改内核）</text>
  <rect x="48" y="448" width="270" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="183" y="466" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#444441">RayScan · Chameleon</text>
  <text x="183" y="484" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">外部 MCP Server，已联调</text>
  <rect x="330" y="448" width="270" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="465" y="466" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#444441">poxiao · ruoyi-scan · RsaCtfTool</text>
  <text x="465" y="484" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">CLI 子进程 · 三态判定 / CTF 工具链</text>
  <rect x="612" y="448" width="262" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="743" y="466" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#444441">内置工具 · 浏览器自动化</text>
  <text x="743" y="484" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">stdlib 零依赖闭环 · LogicHunt</text>

  <line x1="460" y1="512" x2="460" y2="536" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 环境层 -->
  <rect x="30" y="540" width="860" height="84" rx="14" fill="#F5F9FD" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="48" y="562" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#185FA5">环境层 · 隔离与边界（随模式生效，调用方绕不过）</text>
  <rect x="48" y="574" width="270" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="183" y="596" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">Docker / WSL2 隔离执行</text>
  <rect x="330" y="574" width="270" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="465" y="596" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">目标白名单硬校验（PolicyGate）</text>
  <rect x="612" y="574" width="262" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="743" y="596" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#444441">网络出口策略 · 审批档位</text>
</svg>
