[pytest]
# 收集边界（2026-09-24 补）：`data/` 下会落评测产物与**克隆的第三方仓库**，后者自带
# tests/ 与 import 自包内模块——仓库根直接跑 `pytest`（不带 `tests`，IDE 的"跑全部
# 测试"就是这么调的）会递归进去并**收集中断**：
#   ModuleNotFoundError: No module named 'cyberchef_api_mcp_server'
# 第三方包没装是本分、不是缺陷，所以把它挡在收集范围外，而不是去装依赖。
# 两条各司其职：testpaths 只在不传参时生效；显式传根目录（`pytest .`）要靠
# norecursedirs 兜。norecursedirs 一旦显式设置即**替换**默认值，故默认项一并列出
# ——否则 `.*`（.git / .venv）会被递归，收集反而更慢。
testpaths = tests
norecursedirs = data .* *.egg _darcs build CVS dist node_modules venv {arch}
markers =
    penagent: XPentest agent tests